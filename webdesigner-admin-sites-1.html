<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap');
        
        body {
            font-family: 'Noto Sans KR', system-ui, sans-serif;
        }
        
        .card {
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.08);
            transition: all 0.2s ease;
        }
        
        .light-blue-bg {
            background-color: #E6F0FF;
        }
        
        .section-card {
            background-color: white;
            border-radius: 22px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.08);
        }
        
        .site-row {
            transition: all 0.2s ease;
        }
        
        .pin-badge {
            background-color: #2563EB;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body class="light-blue-bg min-h-screen py-4">
    <div class="max-w-[420px] mx-auto px-4">
        
        <!-- 상단 제목 및 안내문구 -->
        <div class="mb-5">
            <h1 class="text-2xl font-bold text-slate-900">현장 관리</h1>
            <p class="mt-1 text-sm text-slate-600">등록된 현장 정보를 확인하고 관리하세요.</p>
        </div>

        <!-- 현장 추가 버튼 -->
        <div class="mb-5">
            <button onclick="addSite()"
                    class="w-full flex items-center justify-center gap-2 bg-[#2563EB] hover:bg-[#1E55C8] transition-colors text-white py-[13px] rounded-full text-sm font-semibold shadow-md">
                <i class="fa-solid fa-plus text-base"></i>
                <span>현장 추가</span>
            </button>
        </div>

        <!-- 현장 리스트 -->
        <div class="space-y-3">
            
            <!-- 현장 1 -->
            <div class="section-card rounded-[22px] p-4">
                <div class="flex gap-3">
                    <!-- 파란 원형 위치 아이콘 배지 -->
                    <div class="w-10 h-10 pin-badge rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                        <i class="fa-solid fa-location-dot text-white text-lg"></i>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-bold text-base text-slate-900">앤드테라스</h3>
                                <p class="text-sm text-slate-600 mt-0.5">서울 강남구</p>
                            </div>
                            
                            <!-- 우측 버튼들 -->
                            <div class="flex flex-col gap-1.5 ml-2">
                                <button onclick="editSite('앤드테라스')"
                                        class="px-3 py-1 bg-[#2563EB]/10 hover:bg-[#2563EB]/20 text-[#2563EB] text-xs font-medium rounded-full transition-colors">
                                    수정
                                </button>
                                <button onclick="deactivateSite('앤드테라스')"
                                        class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-600 text-xs font-medium rounded-full transition-colors">
                                    비활성화
                                </button>
                                <button onclick="deleteSite('앤드테라스')"
                                        class="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-500 text-xs font-medium rounded-full transition-colors">
                                    삭제
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-3 bg-slate-50 rounded-xl px-3 py-2">
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs text-slate-500">배치 인원</span>
                                <span class="text-xs font-semibold text-slate-700">우세균직원, 테스트 직원</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 현장 2 -->
            <div class="section-card rounded-[22px] p-4">
                <div class="flex gap-3">
                    <!-- 파란 원형 위치 아이콘 배지 -->
                    <div class="w-10 h-10 pin-badge rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                        <i class="fa-solid fa-location-dot text-white text-lg"></i>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-bold text-base text-slate-900">팝마트코리아</h3>
                                <p class="text-sm text-slate-600 mt-0.5">서울 송파구</p>
                            </div>
                            
                            <!-- 우측 버튼들 -->
                            <div class="flex flex-col gap-1.5 ml-2">
                                <button onclick="editSite('팝마트코리아')"
                                        class="px-3 py-1 bg-[#2563EB]/10 hover:bg-[#2563EB]/20 text-[#2563EB] text-xs font-medium rounded-full transition-colors">
                                    수정
                                </button>
                                <button onclick="deactivateSite('팝마트코리아')"
                                        class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-600 text-xs font-medium rounded-full transition-colors">
                                    비활성화
                                </button>
                                <button onclick="deleteSite('팝마트코리아')"
                                        class="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-500 text-xs font-medium rounded-full transition-colors">
                                    삭제
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-3 bg-slate-50 rounded-xl px-3 py-2">
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs text-slate-500">배치 인원</span>
                                <span class="text-xs font-semibold text-slate-700">테스트 직원</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        function tailwindInit() {
            // Tailwind 추가 설정 (필요 시)
        }
        
        function editSite(siteName) {
            alert(`${siteName} 현장 정보를 수정합니다.`);
        }
        
        function deactivateSite(siteName) {
            if (confirm(`${siteName} 현장을 비활성화 하시겠습니까?`)) {
                alert(`${siteName} 현장이 비활성화 되었습니다.`);
            }
        }
        
        function deleteSite(siteName) {
            if (confirm(`${siteName} 현장을 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.`)) {
                alert(`${siteName} 현장이 삭제되었습니다.`);
                // 실제로는 해당 카드를 삭제하는 로직 추가 가능
            }
        }
        
        function addSite() {
            alert('새로운 현장을 추가하는 화면으로 이동합니다.');
            // 실제로는 모달이나 새 페이지로 이동시키는 로직
        }
        
        // 모바일 420px 컨테이너 정렬 확인용
        window.onload = function() {
            console.log('%c[Preview] 420px 모바일 스타일 적용 완료', 'color:#64748b');
        }
    </script>
</body>
</html>
