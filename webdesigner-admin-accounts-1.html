<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .card {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .input-rounded {
            border-radius: 14px;
        }
        .account-row {
            transition: background-color 0.2s;
        }
        .account-row:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-[#F1F5F9]">
    <div class="max-w-[420px] mx-auto min-h-screen bg-[#F1F5F9]">
        
        <!-- 헤더 -->
        <div class="px-5 pt-6 pb-4">
            <div class="flex items-center gap-3 mb-1">
                <h1 class="text-2xl font-bold text-slate-800">계정 관리</h1>
            </div>
            <p class="text-sm text-slate-500">매니저 및 최고관리자 계정을 관리합니다.</p>
        </div>

        <!-- 계정 추가 폼 -->
        <div class="mx-4 bg-white rounded-[22px] p-5 card mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="font-semibold text-slate-700">새 계정 추가</div>
            </div>
            
            <div class="space-y-3">
                <!-- 역할 선택 -->
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1.5">역할</label>
                    <select id="role" class="w-full border border-slate-200 bg-white py-2.5 px-4 text-sm rounded-[14px] focus:outline-none focus:border-[#2563EB]">
                        <option value="매니저">매니저</option>
                        <option value="최고관리자">최고관리자</option>
                    </select>
                </div>

                <!-- 이름 -->
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1.5">이름</label>
                    <input id="name" type="text" 
                           class="w-full border border-slate-200 py-2.5 px-4 text-sm rounded-[14px] focus:outline-none focus:border-[#2563EB]"
                           placeholder="이름을 입력하세요">
                </div>

                <!-- 아이디 -->
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1.5">아이디</label>
                    <input id="userid" type="text" 
                           class="w-full border border-slate-200 py-2.5 px-4 text-sm rounded-[14px] focus:outline-none focus:border-[#2563EB]"
                           placeholder="아이디를 입력하세요">
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1.5">비밀번호</label>
                    <input id="password" type="password" 
                           class="w-full border border-slate-200 py-2.5 px-4 text-sm rounded-[14px] focus:outline-none focus:border-[#2563EB]"
                           placeholder="비밀번호를 입력하세요">
                </div>
            </div>

            <!-- 추가 버튼 -->
            <button onclick="addAccount()"
                    class="mt-5 w-full bg-[#2563EB] hover:bg-[#1d4ed8] active:bg-[#1e40af] transition-colors text-white font-semibold py-[13px] rounded-[14px] text-sm">
                계정 추가
            </button>
        </div>

        <!-- 계정 목록 -->
        <div class="px-4 pb-8">
            <div class="flex items-center justify-between px-1 mb-2">
                <div class="text-sm font-semibold text-slate-600">계정 목록</div>
                <div class="text-xs text-slate-400" id="account-count">총 2명</div>
            </div>
            
            <div id="account-list" 
                 class="bg-white rounded-[22px] shadow-sm border border-slate-100 overflow-hidden card">
                <!-- JS로 동적 생성 -->
            </div>
        </div>
        
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind 스크립트
        function initializeTailwind() {
            // 추가 설정 불필요 (기본값 사용)
        }

        // 계정 데이터
        let accounts = [
            {
                id: 1,
                name: "dntprbs",
                userid: "dntprbs",
                role: "최고관리자",
                active: true
            },
            {
                id: 2,
                name: "테스트매니저",
                userid: "testmanager",
                role: "매니저",
                active: false
            }
        ];

        // 계정 목록 렌더링
        function renderAccountList() {
            const container = document.getElementById('account-list');
            container.innerHTML = '';

            if (accounts.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'px-5 py-8 text-center text-sm text-slate-400';
                empty.textContent = '등록된 계정이 없습니다.';
                container.appendChild(empty);
                return;
            }

            accounts.forEach((account, index) => {
                const row = document.createElement('div');
                row.className = `flex items-center justify-between px-4 py-[14px] account-row ${index !== accounts.length - 1 ? 'border-b border-slate-100' : ''}`;

                const activeClass = account.active 
                    ? 'bg-[#2563EB] text-white' 
                    : 'bg-slate-100 text-slate-500 hover:bg-slate-200';

                const btnText = account.active ? '비활성화' : '활성화';

                row.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-[15px] text-slate-700">${account.name}</span>
                            <span class="inline-block px-1.5 py-0.5 text-[9px] font-medium rounded bg-slate-100 text-slate-400">${account.role}</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5">${account.userid}</div>
                    </div>
                    
                    <div class="flex items-center">
                        <button onclick="toggleAccountStatus(${account.id}, ${index})"
                                class="text-xs font-medium px-4 py-[6px] rounded-[10px] transition-all ${activeClass}">
                            ${btnText}
                        </button>
                    </div>
                `;
                
                container.appendChild(row);
            });

            // 총 인원 수 업데이트
            document.getElementById('account-count').textContent = `총 ${accounts.length}명`;
        }

        // 계정 활성/비활성 토글
        function toggleAccountStatus(accountId, index) {
            accounts[index].active = !accounts[index].active;
            renderAccountList();
        }

        // 계정 추가
        function addAccount() {
            const name = document.getElementById('name').value.trim();
            const userid = document.getElementById('userid').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;

            if (!name || !userid || !password) {
                alert('이름, 아이디, 비밀번호를 모두 입력해주세요.');
                return;
            }

            // 새 계정 추가
            const newAccount = {
                id: Date.now(),
                name: name,
                userid: userid,
                role: role,
                active: true
            };

            accounts.unshift(newAccount); // 최상단에 추가
            renderAccountList();

            // 입력 필드 초기화
            document.getElementById('name').value = '';
            document.getElementById('userid').value = '';
            document.getElementById('password').value = '';

            // 성공 피드백 (간단하게)
            const originalText = event.target?.textContent || '';
            const btn = event.currentTarget;
            if (btn) btn.textContent = '추가 완료!';
            
            setTimeout(() => {
                if (btn) btn.textContent = '계정 추가';
            }, 1200);
        }

        // 초기화
        function init() {
            initializeTailwind();
            renderAccountList();

            // Enter 키로 계정 추가 가능하게
            const inputs = document.querySelectorAll('#name, #userid, #password');
            inputs.forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addAccount();
                    }
                });
            });
        }

        // 시작
        window.onload = init;
    </script>
</body>
</html>
