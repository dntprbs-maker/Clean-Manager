name: Patch widget date deep link once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-widget-date-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch AppContext widget date initialization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/context/AppContext.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''  const [current,setCurrent]   = useState(() => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1);
          });
          const [selDate,setSelDate]   = useState(() => fmt(new Date()));'''
          new = '''  const widgetDate = (() => {
            try {
              const raw = new URLSearchParams(window.location.search).get("widgetDate");
              if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(raw || "")) return null;
              const d = new Date(raw + "T00:00:00");
              if (Number.isNaN(d.getTime())) return null;
              return { raw, d };
            } catch { return null; }
          })();
          const [current,setCurrent]   = useState(() => {
            const d = widgetDate?.d || new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1);
          });
          const [selDate,setSelDate]   = useState(() => widgetDate?.raw || fmt(new Date()));'''

          if old not in s:
              if 'const widgetDate = (() =>' in s:
                  print('Widget date support already present; no change needed.')
                  raise SystemExit(0)
              raise SystemExit('Expected AppContext initialization block not found')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- src/context/AppContext.jsx; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.jsx
          git commit -m 'feat: open calendar on widget-selected date'
          git push
