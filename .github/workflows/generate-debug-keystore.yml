name: Generate Fixed Debug Keystore (one-off)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug-widget.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CleanManager Debug, OU=Dev, O=CleanManager, L=Seoul, S=Seoul, C=KR"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-widget-keystore
          path: debug-widget.keystore
