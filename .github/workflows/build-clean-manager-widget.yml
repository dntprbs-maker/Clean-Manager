name: Build Clean Manager Widgets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-clean-manager-widget.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CM_WIDGET_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CM_WIDGET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_WIDGET_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CM_WIDGET_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing CM_WIDGET_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASS" || (echo 'Missing CM_WIDGET_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing CM_WIDGET_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASS" || (echo 'Missing CM_WIDGET_KEY_PASSWORD' && exit 1)

      - name: Restore fixed release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CM_WIDGET_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/cm-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cm-signing/clean-manager-widget-release.jks"

      - name: Build fixed-signed release APK
        env:
          CM_WIDGET_KEYSTORE_PATH: ${{ runner.temp }}/cm-signing/clean-manager-widget-release.jks
          CM_WIDGET_KEYSTORE_PASSWORD: ${{ secrets.CM_WIDGET_KEYSTORE_PASSWORD }}
          CM_WIDGET_KEY_ALIAS: ${{ secrets.CM_WIDGET_KEY_ALIAS }}
          CM_WIDGET_KEY_PASSWORD: ${{ secrets.CM_WIDGET_KEY_PASSWORD }}
        run: gradle -p android-widget assembleRelease

      - name: Friendly APK name
        run: cp android-widget/app/build/outputs/apk/release/app-release.apk clean-manager-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clean-manager-widget-apk
          path: clean-manager-widget.apk

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clean-manager-widget-latest --cleanup-tag -y || true
          gh release create clean-manager-widget-latest clean-manager-widget.apk --title 'Clean Manager Widget APK' --notes '1.6.0부터 동일한 고정 release 서명키를 사용합니다. 이후 버전은 삭제 없이 업데이트 설치할 수 있습니다.'
